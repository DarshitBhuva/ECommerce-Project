otel:
  enabled: false
  url: http://localhost:4318

management:
  opentelemetry:
    logging:
      export:
        otlp:
          endpoint: ${otel.url}/v1/logs
        schedule-delay: 1s
    tracing:
      export:
        otlp:
          endpoint: ${otel.url}/v1/traces
  otlp:
    metrics:
      export:
        url: ${otel.url}/v1/metrics
        enabled: ${otel.enabled}
  tracing:
    sampling:
      probability: 1.0
    export:
      otlp:
        enabled: ${otel.enabled}